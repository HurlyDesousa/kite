server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /kite/state {
        if ($request_method != POST) {
            return 405;
        }
        client_max_body_size 64k;
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
